name: Deploy Shiny App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('shiny', 'DT', 'rsconnect', 'BiocManager'), repos = 'https://cloud.r-project.org')"
          Rscript -e "BiocManager::install('topGO', ask = FALSE)"

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPSIO_TOKEN: ${{ secrets.SHINYAPPSIO_TOKEN }}
          SHINYAPPSIO_SECRET: ${{ secrets.SHINYAPPSIO_SECRET }}
        run: |
          Rscript -e "
            library(rsconnect)
            rsconnect::setAccountInfo(
              name   = 'vierakovacova',
              token  = Sys.getenv('SHINYAPPSIO_TOKEN'),
              secret = Sys.getenv('SHINYAPPSIO_SECRET')
            )
            rsconnect::deployApp(
              appDir   = '.',
              appName  = 'BsubtilisGO',
              appFiles = c('app.R', 'PG10id_BSUBid_goBiolP_goMolF_goCellComp.csv', '.Rprofile'),
              logLevel = 'verbose',
              forceUpdate = TRUE
            )
          "
